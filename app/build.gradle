plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xcluice.geminishell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xcluice.geminishell'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'geminishell'
            keyAlias 'key'
            keyPassword 'geminishell'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
